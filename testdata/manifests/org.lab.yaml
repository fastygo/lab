apiVersion: lab.fastygo.dev/v1
kind: LabManifest
metadata:
  name: org
spec:
  lab: org
  adapter:
    id: wordpress
    config:
      baseUrl: http://127.0.0.1:8080
      themeZip: testdata/dist/latte.zip
      seedFile: testdata/fixtures/org-seed.json
  policy:
    pack: wordpress-org
  gates:
    - id: C1-zip-lint
      checks:
        - id: zip-lint
          runner: zip-lint
    - id: C2-theme-check
      checks:
        - id: theme-check
          runner: theme-check
          config:
            # Join compose project network + share WP files (after: make org-up)
            dockerNetwork: fastygo-lab_lab
            wpDataVolume: fastygo-lab_wp_org_data
            internalUrl: http://wordpress
            fixturesDir: testdata/fixtures
            seedOut: testdata/fixtures
    - id: C3-matrix
      checks:
        - id: url-matrix
          runner: http-matrix
        - id: notice-hunter
          runner: notice-hunter
          config:
            dockerNetwork: fastygo-lab_lab
            wpDataVolume: fastygo-lab_wp_org_data
            internalUrl: http://wordpress
    - id: C4-keyboard
      checks:
        - id: keyboard
          runner: org-keyboard
          config:
            # Browser needs a host-reachable URL (WP redirects away from http://wordpress).
            dockerNetwork: host
            internalUrl: http://127.0.0.1:8080
