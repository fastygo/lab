apiVersion: lab.fastygo.dev/v1
kind: LabManifest
metadata:
  name: org
spec:
  lab: org
  adapter:
    id: wordpress
    config:
      baseUrl: http://127.0.0.1:8080
      themeZip: testdata/dist/latte.zip
  policy:
    pack: wordpress-org
  gates:
    - id: C1-zip-lint
      checks:
        - id: zip-lint
          runner: zip-lint
    - id: C2-theme-check
      checks:
        - id: theme-check
          runner: theme-check
          config:
            # Join compose project network + share WP files (after: make org-up)
            dockerNetwork: fastygo-lab_lab
            wpDataVolume: fastygo-lab_wp_org_data
            internalUrl: http://wordpress
    - id: C3-matrix
      checks:
        - id: url-matrix
          runner: http-matrix
