apiVersion: lab.fastygo.dev/v1
kind: LabManifest
metadata:
  name: sec
spec:
  lab: sec
  adapter:
    id: wordpress
    config:
      baseUrl: http://127.0.0.1:8080
  policy:
    pack: secure-baseline
  gates:
    # headers runner covers S1 recon probes + S5 security header scorecard
    - id: S1-recon
      checks:
        - id: http-recon
          runner: headers
    - id: S2-wpscan
      checks:
        - id: wpscan-enum
          runner: wpscan
          config:
            dockerNetwork: host
