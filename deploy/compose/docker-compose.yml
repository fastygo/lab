# FastyGo Lab — local Compose profiles
#
# Profiles: smoke | quality | org | sec | full
#
#   docker compose -f deploy/compose/docker-compose.yml --profile smoke up -d
#   docker compose -f deploy/compose/docker-compose.yml --profile org up -d
#
# Build runners (from repo root):
#   docker build -t lab/lighthouse:local runners/lighthouse
#   docker build -t lab/axe:local runners/axe
#   docker build -t lab/theme-check:local runners/theme-check
#   docker build -t lab/vnu:local runners/vnu
#   docker build -t lab/wpscan:local runners/wpscan
#
# Org Gate 2 (Theme Check) expects:
#   - profile org up (db + wordpress + wpcli)
#   - theme zip at testdata/dist/latte.zip (mounted into runners via docker -v)
#   - lab run uses dockerNetwork=fastygo-lab_lab + wpDataVolume=fastygo-lab_wp_org_data
#
# SaaS (Cycle F) — until Postgres/queue land, run API+worker in-process on the host:
#   make api          # LAB_API_ADDR=:8090  LAB_REPO_ROOT=<repo>
#   curl -sS -X POST http://127.0.0.1:8090/v1/runs \
#     -H 'Content-Type: application/json' \
#     -d '{"preset":"demo","sync":true}'
# Compose profile `saas` (Postgres + API image) is planned under F1.1 — see
# .project/vps/cycle-f-saas.md. Worker shape = same orchestrator as CLI + EventSink.
#
# See .project/constructor/compose-profiles.md

name: fastygo-lab

networks:
  lab:
    driver: bridge

volumes:
  wp_org_data:
  db_org_data:

services:
  lab-smoke-stub:
    profiles: ["smoke"]
    image: alpine:3.20
    networks: [lab]
    command: ["sh", "-c", "echo 'FastyGo Lab smoke profile stub' && sleep infinity"]
    labels:
      lab.fastygo.dev/profile: smoke

  lab-fixture:
    profiles: ["quality", "full"]
    image: nginx:1.27-alpine
    networks: [lab]
    volumes:
      - ../../testdata/fixtures/quality-site:/usr/share/nginx/html:ro
    ports:
      - "8091:80"
    labels:
      lab.fastygo.dev/profile: quality
      lab.fastygo.dev/role: fixture

  db:
    profiles: ["org", "sec", "full"]
    image: mysql:8.0
    networks: [lab]
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_org_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    profiles: ["org", "sec", "full"]
    image: wordpress:php8.2-apache
    networks: [lab]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      # Public URL for asset links (CSS/JS). Override for remote lab hosts:
      #   LAB_WP_URL=http://5.129.242.217:8080 docker compose ... up -d
      LAB_WP_URL: ${LAB_WP_URL:-http://127.0.0.1:8080}
      # $$ → literal $ for PHP (compose must not interpolate)
      WORDPRESS_CONFIG_EXTRA: |
        if ($$u = getenv('LAB_WP_URL')) {
          define('WP_HOME', $$u);
          define('WP_SITEURL', $$u);
        }
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        @ini_set('display_errors', 0);
    volumes:
      - wp_org_data:/var/www/html
      # Theme zips for manual wpcli install; Gate 2 mounts zip via docker runner
      - ${LAB_THEME_ZIP_DIR:-../../testdata/dist}:/themes:ro
      - ../../testdata/fixtures:/lab/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
    labels:
      lab.fastygo.dev/role: wordpress

  wpcli:
    profiles: ["org", "sec", "full"]
    image: wordpress:cli-php8.2
    user: "33:33"
    networks: [lab]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_org_data:/var/www/html
      - ${LAB_THEME_ZIP_DIR:-../../testdata/dist}:/themes:ro
      - ../../testdata/fixtures:/lab/fixtures:ro
    depends_on:
      - wordpress
    entrypoint: ["sleep", "infinity"]
    labels:
      lab.fastygo.dev/role: wpcli
